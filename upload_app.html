<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextDrop | TXT & JSON File Uploader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --gray: #6c757d;
            --gray-light: #e9ecef;
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark);
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto;
        }

        .upload-container {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 40px;
            transition: var(--transition);
        }

        .upload-area {
            border: 3px dashed var(--gray-light);
            border-radius: var(--border-radius);
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background-color: rgba(67, 97, 238, 0.03);
        }

        .upload-area i {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .upload-area h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .upload-area p {
            color: var(--gray);
            margin-bottom: 20px;
        }

        .file-types {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .file-type {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--light);
            border-radius: 50px;
            font-weight: 600;
            color: var(--primary);
        }

        .browse-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-block;
        }

        .browse-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .file-input {
            display: none;
        }

        .file-list {
            margin-top: 30px;
        }

        .file-list h4 {
            margin-bottom: 15px;
            color: var(--dark);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background-color: var(--light);
            border-radius: var(--border-radius);
            margin-bottom: 10px;
            transition: var(--transition);
        }

        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background-color: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: white;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .file-size {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-preview {
            background-color: var(--success);
            color: white;
        }

        .btn-preview:hover {
            background-color: #3ab0d5;
        }

        .btn-download {
            background-color: var(--primary);
            color: white;
        }

        .btn-download:hover {
            background-color: var(--primary-dark);
        }

        .btn-delete {
            background-color: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background-color: #e01a6f;
        }

        .progress-bar {
            height: 6px;
            background-color: var(--gray-light);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.3s ease;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: var(--border-radius);
            color: white;
            font-weight: 600;
            box-shadow: var(--box-shadow);
            transform: translateX(150%);
            transition: transform 0.4s ease;
            z-index: 1000;
        }

        .notification.success {
            background-color: var(--success);
        }

        .notification.error {
            background-color: var(--danger);
        }

        .notification.warning {
            background-color: var(--warning);
        }

        .notification.show {
            transform: translateX(0);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: var(--gray-light);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .preview-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .preview-content {
            background-color: white;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow: auto;
            padding: 30px;
            position: relative;
        }

        .preview-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        .preview-body {
            background-color: var(--light);
            padding: 20px;
            border-radius: var(--border-radius);
            max-height: 50vh;
            overflow: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .upload-container {
                padding: 20px;
            }
            
            .upload-area {
                padding: 40px 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .file-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TextDrop</h1>
            <p>Upload and manage your TXT and JSON files with ease. Drag & drop or click to browse.</p>
        </div>
        
        <div class="upload-container">
            <div class="upload-area" id="dropArea">
                <i class="fas fa-file-alt"></i>
                <h3>Drag & Drop Files Here</h3>
                <p>Only TXT and JSON files are accepted</p>
                
                <div class="file-types">
                    <div class="file-type">
                        <i class="fas fa-file-text"></i>
                        <span>TXT Files</span>
                    </div>
                    <div class="file-type">
                        <i class="fas fa-file-code"></i>
                        <span>JSON Files</span>
                    </div>
                </div>
                
                <button class="browse-btn">Browse Files</button>
                <input type="file" class="file-input" id="fileInput" accept=".txt,.json" multiple>
            </div>
            
            <div class="file-list">
                <h4><i class="fas fa-folder-open"></i> Uploaded Files</h4>
                <div id="fileListContainer">
                    <div class="empty-state">
                        <i class="fas fa-file-import"></i>
                        <p>No files uploaded yet</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 TextDrop | All files are saved locally on your device</p>
        </div>
    </div>
    
    <div class="notification" id="notification"></div>
    
    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <button class="close-btn" id="closePreview">&times;</button>
            <div class="preview-header">
                <h2 class="preview-title" id="previewTitle">File Preview</h2>
            </div>
            <div class="preview-body" id="previewBody">
                <!-- File content will be displayed here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const fileListContainer = document.getElementById('fileListContainer');
            const notification = document.getElementById('notification');
            const previewModal = document.getElementById('previewModal');
            const closePreview = document.getElementById('closePreview');
            const previewTitle = document.getElementById('previewTitle');
            const previewBody = document.getElementById('previewBody');
            
            // Load previously saved files from localStorage
            loadSavedFiles();
            
            // Prevent default drag behaviors
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });
            
            // Highlight drop area when item is dragged over it
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            // Handle dropped files
            dropArea.addEventListener('drop', handleDrop, false);
            
            // Handle file input change
            fileInput.addEventListener('change', handleFiles, false);
            
            // Browse button click
            dropArea.querySelector('.browse-btn').addEventListener('click', () => {
                fileInput.click();
            });
            
            // Close preview modal
            closePreview.addEventListener('click', () => {
                previewModal.classList.remove('active');
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            function highlight() {
                dropArea.classList.add('dragover');
            }
            
            function unhighlight() {
                dropArea.classList.remove('dragover');
            }
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles({ target: { files } });
            }
            
            function handleFiles(e) {
                const files = e.target.files;
                
                if (files.length === 0) return;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    
                    // Check if file is TXT or JSON
                    if (file.type === 'text/plain' || file.name.endsWith('.txt') || 
                        file.type === 'application/json' || file.name.endsWith('.json')) {
                        processFile(file);
                    } else {
                        showNotification(`"${file.name}" is not a TXT or JSON file.`, 'error');
                    }
                }
            }
            
            function processFile(file) {
                // Show upload progress
                const fileItem = createFileItem(file);
                fileListContainer.appendChild(fileItem);
                
                // Remove empty state if it exists
                const emptyState = fileListContainer.querySelector('.empty-state');
                if (emptyState) {
                    emptyState.remove();
                }
                
                // Simulate upload progress
                simulateUploadProgress(fileItem, file);
            }
            
            function createFileItem(file) {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.dataset.filename = file.name;
                
                const fileSize = formatFileSize(file.size);
                const fileType = file.name.endsWith('.json') ? 'JSON' : 'TXT';
                
                fileItem.innerHTML = `
                    <div class="file-icon">
                        ${fileType === 'JSON' ? '<i class="fas fa-file-code"></i>' : '<i class="fas fa-file-text"></i>'}
                    </div>
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">${fileSize} • ${fileType}</div>
                        <div class="progress-bar">
                            <div class="progress"></div>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="btn btn-preview">Preview</button>
                        <button class="btn btn-download">Download</button>
                        <button class="btn btn-delete">Delete</button>
                    </div>
                `;
                
                // Add event listeners for buttons
                const previewBtn = fileItem.querySelector('.btn-preview');
                const downloadBtn = fileItem.querySelector('.btn-download');
                const deleteBtn = fileItem.querySelector('.btn-delete');
                
                previewBtn.addEventListener('click', () => previewFile(file));
                downloadBtn.addEventListener('click', () => downloadFile(file));
                deleteBtn.addEventListener('click', () => deleteFile(fileItem, file.name));
                
                return fileItem;
            }
            
            function simulateUploadProgress(fileItem, file) {
                const progressBar = fileItem.querySelector('.progress');
                let progress = 0;
                
                const interval = setInterval(() => {
                    progress += Math.random() * 10;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        
                        // Save file to localStorage after "upload"
                        saveFileLocally(file);
                        
                        // Show success notification
                        showNotification('File uploaded successfully!', 'success');
                    }
                    
                    progressBar.style.width = `${progress}%`;
                }, 100);
            }
            
            function saveFileLocally(file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const fileData = {
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        data: e.target.result,
                        uploadedAt: new Date().toISOString()
                    };
                    
                    // Get existing files from localStorage
                    const savedFiles = JSON.parse(localStorage.getItem('uploadedFiles') || '[]');
                    
                    // Add new file
                    savedFiles.push(fileData);
                    
                    // Save back to localStorage
                    localStorage.setItem('uploadedFiles', JSON.stringify(savedFiles));
                };
                
                reader.readAsDataURL(file);
            }
            
            function loadSavedFiles() {
                const savedFiles = JSON.parse(localStorage.getItem('uploadedFiles') || '[]');
                
                if (savedFiles.length === 0) return;
                
                // Remove empty state
                const emptyState = fileListContainer.querySelector('.empty-state');
                if (emptyState) {
                    emptyState.remove();
                }
                
                // Create file items for saved files
                savedFiles.forEach(fileData => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.dataset.filename = fileData.name;
                    
                    const fileSize = formatFileSize(fileData.size);
                    const fileType = fileData.name.endsWith('.json') ? 'JSON' : 'TXT';
                    
                    fileItem.innerHTML = `
                        <div class="file-icon">
                            ${fileType === 'JSON' ? '<i class="fas fa-file-code"></i>' : '<i class="fas fa-file-text"></i>'}
                        </div>
                        <div class="file-info">
                            <div class="file-name">${fileData.name}</div>
                            <div class="file-size">${fileSize} • ${fileType} • Uploaded ${formatDate(fileData.uploadedAt)}</div>
                            <div class="progress-bar">
                                <div class="progress" style="width: 100%"></div>
                            </div>
                        </div>
                        <div class="file-actions">
                            <button class="btn btn-preview">Preview</button>
                            <button class="btn btn-download">Download</button>
                            <button class="btn btn-delete">Delete</button>
                        </div>
                    `;
                    
                    // Add event listeners for buttons
                    const previewBtn = fileItem.querySelector('.btn-preview');
                    const downloadBtn = fileItem.querySelector('.btn-download');
                    const deleteBtn = fileItem.querySelector('.btn-delete');
                    
                    previewBtn.addEventListener('click', () => previewSavedFile(fileData));
                    downloadBtn.addEventListener('click', () => downloadSavedFile(fileData));
                    deleteBtn.addEventListener('click', () => deleteFile(fileItem, fileData.name));
                    
                    fileListContainer.appendChild(fileItem);
                });
            }
            
            function previewFile(file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    previewTitle.textContent = `Preview: ${file.name}`;
                    
                    if (file.name.endsWith('.json')) {
                        try {
                            const jsonContent = JSON.parse(e.target.result);
                            previewBody.textContent = JSON.stringify(jsonContent, null, 2);
                        } catch (err) {
                            previewBody.textContent = e.target.result;
                        }
                    } else {
                        previewBody.textContent = e.target.result;
                    }
                    
                    previewModal.classList.add('active');
                };
                
                reader.readAsText(file);
            }
            
            function previewSavedFile(fileData) {
                previewTitle.textContent = `Preview: ${fileData.name}`;
                
                // Extract text from data URL
                const base64Data = fileData.data.split(',')[1];
                const textContent = atob(base64Data);
                
                if (fileData.name.endsWith('.json')) {
                    try {
                        const jsonContent = JSON.parse(textContent);
                        previewBody.textContent = JSON.stringify(jsonContent, null, 2);
                    } catch (err) {
                        previewBody.textContent = textContent;
                    }
                } else {
                    previewBody.textContent = textContent;
                }
                
                previewModal.classList.add('active');
            }
            
            function downloadFile(file) {
                const url = URL.createObjectURL(file);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            function downloadSavedFile(fileData) {
                const a = document.createElement('a');
                a.href = fileData.data;
                a.download = fileData.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
            
            function deleteFile(fileItem, filename) {
                // Remove from DOM
                fileItem.remove();
                
                // Remove from localStorage
                const savedFiles = JSON.parse(localStorage.getItem('uploadedFiles') || '[]');
                const updatedFiles = savedFiles.filter(file => file.name !== filename);
                localStorage.setItem('uploadedFiles', JSON.stringify(updatedFiles));
                
                // Show empty state if no files left
                if (fileListContainer.children.length === 0) {
                    fileListContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-file-import"></i>
                            <p>No files uploaded yet</p>
                        </div>
                    `;
                }
                
                // Show notification
                showNotification('File deleted successfully!', 'success');
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString() + ' at ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }
            
            function showNotification(message, type) {
                notification.textContent = message;
                notification.className = `notification ${type}`;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
